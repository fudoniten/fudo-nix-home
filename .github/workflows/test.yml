name: Nix Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check --show-trace

      - name: Static analysis with statix
        run: nix run nixpkgs#statix -- check .

      # Unused function arguments are allowed: the curried user-file
      # convention (see AGENTS.md) passes every file the same arguments.
      - name: Check for dead code with deadnix
        run: nix run nixpkgs#deadnix -- --fail --no-lambda-arg --no-lambda-pattern-names .

      - name: Check formatting with nixfmt
        run: nix fmt -- --ci

  module-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate NixOS module exports
        run: |
          echo "Checking NixOS module structure..."
          nix eval .#nixosModules.default --show-trace
          nix eval .#nixosModules.home-configuration --show-trace

      - name: Validate mkModule function exists
        run: |
          echo "Checking mkModule.niten function..."
          nix eval .#mkModule.niten --apply 'x: builtins.isFunction x' --show-trace

      - name: Validate flake outputs
        run: |
          echo "Verifying all flake outputs are accessible..."
          nix flake show --show-trace

  test-configurations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Every user through the NixOS module, plus standalone mkModule.niten on
      # Linux and aarch64-darwin. Evaluation only, so darwin works here too.
      - name: Evaluate user configurations
        run: |
          nix eval --impure --json --show-trace --expr \
            'import ./tests/eval.nix { flake = builtins.getFlake (toString ./.); }'
